name: Sync NavTree from wiki-llm

on:
  repository_dispatch:
    types: [navtree-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch navtree output from wiki-llm
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PlateauPerspectives/wiki-llm.git /tmp/wiki-llm
          cd /tmp/wiki-llm
          git sparse-checkout set .navtree/output

      - name: Sync to src/data
        run: |
          if [ ! -d /tmp/wiki-llm/.navtree/output ]; then
            echo "ERROR: .navtree/output not found in wiki-llm"
            exit 1
          fi
          rm -rf src/data
          cp -r /tmp/wiki-llm/.navtree/output src/data

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync navtree data from wiki-llm"
            git push
          fi
